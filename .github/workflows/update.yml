name: Update VPN Sources
on:
  schedule:
    - cron: '15 2 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Run the configured multi-source scan now'
        required: false
        default: true
        type: boolean
permissions:
  contents: write
concurrency:
  group: auto-vpnlink-update
  cancel-in-progress: true
jobs:
  scan:
    name: Scan, health-check and publish sources
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run multi-source scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scanner.py
      - name: Widen protocol extraction
        run: python augment_protocols.py
      - name: Select large, diverse health-check candidate pool
        run: |
          python select_nodes.py
          cp output/health-candidates.txt output/verified-nodes.txt
      - name: Convert health-check candidates to Clash config
        run: python converter.py
      - name: Install latest Mihomo for real protocol checks
        run: |
          set -euo pipefail
          mkdir -p .bin
          API='https://api.github.com/repos/MetaCubeX/mihomo/releases/latest'
          URL=$(curl -fsSL "$API" | python -c "import json,sys; d=json.load(sys.stdin); print(next((a['browser_download_url'] for a in d.get('assets',[]) if 'linux-amd64' in a['name'] and a['name'].endswith('.gz')), ''))")
          test -n "$URL"
          curl -fL --retry 3 "$URL" -o .bin/mihomo.gz
          gzip -df .bin/mihomo.gz
          if [ -f .bin/mihomo ]; then :; else BIN=$(find .bin -maxdepth 1 -type f -name 'mihomo*' ! -name '*.gz' -print -quit); test -n "$BIN"; mv "$BIN" .bin/mihomo; fi
          chmod +x .bin/mihomo
          .bin/mihomo -v
      - name: Health-check CFW-compatible protocols
        env:
          MIHOMO_BIN: ${{ github.workspace }}/.bin/mihomo
          HEALTHCHECK_MAX: '540'
          HEALTHCHECK_TIMEOUT: '12'
          HEALTHCHECK_ROUNDS: '2'
          HEALTHCHECK_ROUND_DELAY: '1'
          HEALTHCHECK_MIN_PUBLIC_TESTS: '2'
          HEALTHCHECK_TYPES: 'ss,trojan,vmess,vless'
          HEALTHCHECK_OUTPUT: 'health-checked-cfw.txt'
          HEALTHCHECK_REPORT: 'healthcheck-cfw.json'
        run: python healthcheck.py
      - name: Build CFW publish pool only from CFW health checks
        run: |
          cp output/health-checked-cfw.txt output/health-checked-nodes.txt
          python merge_publish.py
          python publish_outputs.py
          python filter_clash_healthy.py
      - name: Validate published CFW config
        run: |
          set -euo pipefail
          python - <<'PY'
          import yaml
          from pathlib import Path
          c=yaml.safe_load(Path('output/clash.yaml').read_text()) or {}
          p=c.get('proxies') or []
          allowed={'ss','ssr','vmess','trojan'}
          assert p, 'No CFW-compatible healthy nodes were published'
          assert all(str(x.get('type','')).lower() in allowed for x in p), 'Non-CFW proxy leaked into Clash output'
          print('CFW healthy proxies:',len(p))
          print('types:',{t:sum(1 for x in p if x.get('type')==t) for t in allowed})
          PY
      - name: Commit generated results safely
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf /tmp/auto-vpnlink-output
          cp -a output /tmp/auto-vpnlink-output
          git fetch origin main
          git reset --hard origin/main
          rm -rf output
          cp -a /tmp/auto-vpnlink-output output
          git add output/
          if git diff --cached --quiet; then echo 'No output changes.'; else git commit -m 'auto: publish CFW-compatible healthy VPN sources'; git push origin HEAD:main; fi

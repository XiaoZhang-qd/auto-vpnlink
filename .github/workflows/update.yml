name: Update VPN Sources
on:
  schedule:
    - cron: '15 2 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Run the configured multi-source scan now'
        required: false
        default: true
        type: boolean
permissions:
  contents: write
concurrency:
  group: auto-vpnlink-update
  cancel-in-progress: true
jobs:
  scan:
    name: Scan, health-check and publish sources
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run multi-source scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scanner.py
      - name: Widen protocol extraction
        run: python augment_protocols.py
      - name: Select clean, diverse health-check candidates
        run: |
          python select_nodes.py
          cp output/health-candidates.txt output/verified-nodes.txt
      - name: Convert health-check candidates to Clash config
        run: python converter.py
      - name: Install latest Mihomo for real protocol checks
        run: |
          set -euo pipefail
          mkdir -p .bin
          API='https://api.github.com/repos/MetaCubeX/mihomo/releases/latest'
          URL=$(curl -fsSL "$API" | python -c "import json,sys; d=json.load(sys.stdin); print(next((a['browser_download_url'] for a in d.get('assets',[]) if 'linux-amd64' in a['name'] and a['name'].endswith('.gz')), ''))")
          test -n "$URL"
          echo "Downloading $URL"
          curl -fL --retry 3 "$URL" -o .bin/mihomo.gz
          gzip -df .bin/mihomo.gz
          if [ -f .bin/mihomo ]; then echo 'Mihomo binary extracted successfully.'; else BIN=$(find .bin -maxdepth 1 -type f -name 'mihomo*' ! -name '*.gz' -print -quit); test -n "$BIN"; mv "$BIN" .bin/mihomo; fi
          chmod +x .bin/mihomo
          .bin/mihomo -v
      - name: Run real protocol-level health checks without dropping the pool
        env:
          MIHOMO_BIN: ${{ github.workspace }}/.bin/mihomo
          HEALTHCHECK_MAX: '150'
          HEALTHCHECK_TIMEOUT: '12'
        run: python healthcheck.py || echo 'Health check had failures; all valid discovered nodes will still be published.'
      - name: Merge healthy-first complete node pool
        run: python merge_publish.py
      - name: Publish all valid nodes and protocol-specific feeds
        run: python publish_outputs.py
      - name: Show generated files and validate published pool
        run: |
          set -e
          echo '=== Generated output ==='
          find output -maxdepth 1 -type f -print | sort
          echo '=== Publish summary ==='
          cat output/publish-summary.json
          echo '=== Health summary ==='
          if [ -f output/healthcheck.json ]; then cat output/healthcheck.json; else echo 'No health report; publication continued from valid discovered nodes.'; fi
          python - <<'PY'
          import json, yaml
          from pathlib import Path
          s=json.loads(Path('output/publish-summary.json').read_text())
          c=yaml.safe_load(Path('output/clash.yaml').read_text()) or {}
          assert s['published_unique'] > 0, 'published node pool is empty'
          assert len(c.get('proxies') or []) == s['clash_proxies'], 'Clash count mismatch'
          print('published unique:', s['published_unique'])
          print('healthy first:', s['healthy_first'])
          print('Clash proxies:', s['clash_proxies'])
          print('protocols:', s['protocols'])
          PY
      - name: Commit generated results safely
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf /tmp/auto-vpnlink-output
          cp -a output /tmp/auto-vpnlink-output
          git fetch origin main
          git reset --hard origin/main
          rm -rf output
          cp -a /tmp/auto-vpnlink-output output
          git add output/
          if git diff --cached --quiet; then echo 'No output changes.'; else git commit -m 'auto: publish complete deduplicated VPN sources'; git push origin HEAD:main; fi

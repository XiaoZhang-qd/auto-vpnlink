name: Update VPN Sources

on:
  workflow_dispatch:
    inputs:
      search_limit:
        description: 'Maximum discovered nodes to consider'
        required: false
        default: '5000'
        type: string
      health_candidate_limit:
        description: 'Maximum CFW-compatible nodes to test'
        required: false
        default: '300'
        type: string
      health_success_target:
        description: 'Stop after this many successful CFW nodes (0 = test all)'
        required: false
        default: '20'
        type: string
  schedule:
    - cron: '15 2 * * *'
      timezone: Asia/Shanghai

permissions:
  contents: write
concurrency:
  group: auto-vpnlink-update
  cancel-in-progress: true

jobs:
  scan:
    name: Scan, health-check and publish sources
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply run limits
        env:
          SEARCH_LIMIT: ${{ inputs.search_limit || '5000' }}
        run: |
          python - <<'PY'
          import os,yaml
          n=int(os.environ['SEARCH_LIMIT'])
          if not 1<=n<=20000: raise SystemExit('search_limit must be 1..20000')
          with open('sources.yaml',encoding='utf-8') as f:d=yaml.safe_load(f) or {}
          d.setdefault('scan',{})['max_aggregate_nodes']=n
          with open('sources.yaml','w',encoding='utf-8') as f:yaml.safe_dump(d,f,allow_unicode=True,sort_keys=False)
          print('SEARCH_LIMIT=',n)
          PY
      - name: Run multi-source scanner
        env: {GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}}
        run: python scanner.py
      - name: Widen protocol extraction
        run: python augment_protocols.py
      - name: Select CFW health-check pool
        env:
          SEARCH_LIMIT: ${{ inputs.search_limit || '5000' }}
          HEALTH_CANDIDATES: ${{ inputs.health_candidate_limit || '300' }}
        run: |
          python - <<'PY'
          import os
          n=int(os.environ['HEALTH_CANDIDATES'])
          if not 1<=n<=5000: raise SystemExit('health_candidate_limit must be 1..5000')
          PY
          python select_nodes.py
          cp output/health-candidates.txt output/verified-nodes.txt
      - name: Install Mihomo
        run: |
          set -euo pipefail
          mkdir -p .bin
          URL=$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | python -c "import json,sys;d=json.load(sys.stdin);print(next((a['browser_download_url'] for a in d.get('assets',[]) if 'linux-amd64' in a['name'] and a['name'].endswith('.gz')),'')")
          test -n "$URL"
          curl -fL --retry 3 "$URL" -o .bin/mihomo.gz
          gzip -df .bin/mihomo.gz
          test -f .bin/mihomo || { BIN=$(find .bin -maxdepth 1 -type f -name 'mihomo*' ! -name '*.gz' -print -quit);test -n "$BIN";mv "$BIN" .bin/mihomo; }
          chmod +x .bin/mihomo
          .bin/mihomo -v
      - name: Health-check CFW-compatible nodes
        env:
          MIHOMO_BIN: ${{ github.workspace }}/.bin/mihomo
          HEALTHCHECK_MAX: ${{ inputs.health_candidate_limit || '300' }}
          HEALTHCHECK_SUCCESS_TARGET: ${{ inputs.health_success_target || '20' }}
          HEALTHCHECK_TIMEOUT: '12'
          HEALTHCHECK_ROUNDS: '2'
          HEALTHCHECK_ROUND_DELAY: '1'
          HEALTHCHECK_MIN_PUBLIC_TESTS: '2'
          HEALTHCHECK_TYPES: 'ss,trojan,vmess'
          HEALTHCHECK_OUTPUT: health-checked-cfw.txt
          HEALTHCHECK_REPORT: healthcheck-cfw.json
        run: python healthcheck.py
      - name: Publish outputs
        run: |
          cp output/health-checked-cfw.txt output/health-checked-nodes.txt
          python publish_outputs.py
      - name: Validate CFW output
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          h=[x for x in Path('output/health-checked-cfw.txt').read_text(encoding='utf-8',errors='ignore').splitlines() if x.strip()]
          c=yaml.safe_load(Path('output/clash.yaml').read_text(encoding='utf-8')) or {}
          p=c.get('proxies') or []
          if not h: raise SystemExit('No healthy CFW nodes; refusing to publish or overwrite the feed.')
          if not p: raise SystemExit('Healthy CFW nodes exist but Clash output is empty.')
          if len(p)!=len(h): raise SystemExit(f'CFW conversion count mismatch: health={len(h)} clash={len(p)}')
          print(f'CFW verified={len(h)} published={len(p)}')
          PY
      - name: Commit generated results safely
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/
          if git diff --cached --quiet;then echo 'No output changes.';else git commit -m 'auto: publish healthy VPN sources';git push origin HEAD:main;fi

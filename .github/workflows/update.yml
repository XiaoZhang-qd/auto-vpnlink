name: Update VPN Sources
on:
  schedule:
    - cron: '15 2 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Run the configured multi-source scan now'
        required: false
        default: true
        type: boolean
permissions:
  contents: write
concurrency:
  group: auto-vpnlink-update
  cancel-in-progress: true
jobs:
  scan:
    name: Scan and publish sources
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run multi-source scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scanner.py
      - name: Convert verified nodes to client configs
        run: python converter.py
      - name: Show generated files and validate counts
        run: |
          set -e
          echo '=== Generated output ==='
          find output -maxdepth 2 -type f -print | sort
          echo '=== Converter counts ==='
          # converter.py prints its summary; this step validates the actual files.
          node_count=$(grep -cve '^\s*$' output/nodes.txt 2>/dev/null || true)
          verified_count=$(grep -cve '^\s*$' output/verified-nodes.txt 2>/dev/null || true)
          shadowrocket_count=$(grep -cve '^\s*$' output/shadowrocket.txt 2>/dev/null || true)
          echo "verified-nodes.txt: ${verified_count}"
          echo "nodes.txt: ${node_count}"
          echo "shadowrocket.txt: ${shadowrocket_count}"
          echo '=== Clash proxy count ==='
          # yaml.safe_dump emits each proxy as "- name:" under the proxies list.
          # Count only entries inside the proxies section, not proxy-group entries.
          clash_count=$(python - <<'PY'
          import yaml
          from pathlib import Path
          p=yaml.safe_load(Path('output/clash.yaml').read_text(encoding='utf-8')) or {}
          proxies=p.get('proxies') or []
          print(len(proxies))
          PY
          )
          echo "clash.yaml proxies: ${clash_count}"
          echo '=== sing-box / Xray counts ==='
          python - <<'PY'
          import json
          from pathlib import Path
          sb=json.loads(Path('output/sing-box.json').read_text(encoding='utf-8'))
          xr=json.loads(Path('output/xray-outbounds.json').read_text(encoding='utf-8'))
          print('sing-box outbounds:', len(sb.get('outbounds', [])))
          print('xray outbounds:', len(xr.get('outbounds', [])))
          PY
      - name: Commit generated results safely
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf /tmp/auto-vpnlink-output
          cp -a output /tmp/auto-vpnlink-output
          git fetch origin main
          git reset --hard origin/main
          rm -rf output
          cp -a /tmp/auto-vpnlink-output output
          git add output/
          if git diff --cached --quiet; then
            echo 'No output changes.'
          else
            git commit -m 'auto: update VPN sources'
            git push origin HEAD:main
          fi

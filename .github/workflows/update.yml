name: Update VPN Sources
on:
  schedule:
    - cron: '15 2 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      search_limit:
        description: 'Maximum nodes to keep after discovery (search pool)'
        required: false
        default: '5000'
        type: string
      health_success_target:
        description: 'Stop health checks after this many successful nodes'
        required: false
        default: '20'
        type: string
      full_scan:
        description: 'Run the configured multi-source scan now'
        required: false
        default: true
        type: boolean
permissions:
  contents: write
concurrency:
  group: auto-vpnlink-update
  cancel-in-progress: true
jobs:
  scan:
    name: Scan, health-check and publish sources
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply run limits
        env:
          SEARCH_LIMIT: ${{ inputs.search_limit || '5000' }}
        run: |
          python - <<'PY'
          import os,yaml
          p='sources.yaml'
          with open(p,encoding='utf-8') as f: d=yaml.safe_load(f) or {}
          d.setdefault('scan',{})['max_aggregate_nodes']=max(100,min(int(os.environ['SEARCH_LIMIT']),20000))
          with open(p,'w',encoding='utf-8') as f: yaml.safe_dump(d,f,allow_unicode=True,sort_keys=False)
          print('SEARCH_LIMIT=',d['scan']['max_aggregate_nodes'])
          PY
      - name: Run multi-source scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scanner.py
      - name: Widen protocol extraction
        run: python augment_protocols.py
      - name: Select diverse health-check candidate pool
        run: |
          python select_nodes.py
          cp output/health-candidates.txt output/verified-nodes.txt
      - name: Install latest Mihomo for real protocol checks
        run: |
          set -euo pipefail
          mkdir -p .bin
          API='https://api.github.com/repos/MetaCubeX/mihomo/releases/latest'
          URL=$(curl -fsSL "$API" | python -c "import json,sys; d=json.load(sys.stdin); print(next((a['browser_download_url'] for a in d.get('assets',[]) if 'linux-amd64' in a['name'] and a['name'].endswith('.gz')), ''))")
          test -n "$URL"
          curl -fL --retry 3 "$URL" -o .bin/mihomo.gz
          gzip -df .bin/mihomo.gz
          if [ -f .bin/mihomo ]; then :; else BIN=$(find .bin -maxdepth 1 -type f -name 'mihomo*' ! -name '*.gz' -print -quit); test -n "$BIN"; mv "$BIN" .bin/mihomo; fi
          chmod +x .bin/mihomo
          .bin/mihomo -v
      - name: Health-check CFW-compatible protocols
        env:
          MIHOMO_BIN: ${{ github.workspace }}/.bin/mihomo
          HEALTHCHECK_MAX: '540'
          HEALTHCHECK_SUCCESS_TARGET: ${{ inputs.health_success_target || '20' }}
          HEALTHCHECK_TIMEOUT: '12'
          HEALTHCHECK_ROUNDS: '2'
          HEALTHCHECK_ROUND_DELAY: '1'
          HEALTHCHECK_MIN_PUBLIC_TESTS: '2'
          HEALTHCHECK_TYPES: 'ss,trojan,vmess,vless'
          HEALTHCHECK_OUTPUT: 'health-checked-cfw.txt'
          HEALTHCHECK_REPORT: 'healthcheck-cfw.json'
        run: python healthcheck.py
      - name: Publish only CFW health-checked nodes
        run: |
          cp output/health-checked-cfw.txt output/health-checked-nodes.txt
          python publish_outputs.py
      - name: Validate CFW output against health-check results
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          h=[x.strip() for x in Path('output/health-checked-cfw.txt').read_text().splitlines() if x.strip()]
          c=yaml.safe_load(Path('output/clash.yaml').read_text()) or {}
          p=c.get('proxies') or []
          allowed={'ss','ssr','vmess','trojan'}
          assert h, 'No CFW node passed health check; refusing to publish a replacement profile.'
          assert p, 'Health check passed nodes but Clash output is empty.'
          assert all(str(x.get('type','')).lower() in allowed for x in p), 'Non-CFW proxy leaked into Clash output.'
          if len(p) < len(h):
              raise SystemExit(f'CFW conversion lost verified nodes: health={len(h)} clash={len(p)}')
          print(f'CFW verified={len(h)} published={len(p)}')
          print('types:',{t:sum(1 for x in p if str(x.get('type','')).lower()==t) for t in sorted(allowed)})
          PY
      - name: Commit generated results safely
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf /tmp/auto-vpnlink-output
          cp -a output /tmp/auto-vpnlink-output
          git fetch origin main
          git reset --hard origin/main
          rm -rf output
          cp -a /tmp/auto-vpnlink-output output
          git add output/
          if git diff --cached --quiet; then echo 'No output changes.'; else git commit -m 'auto: publish CFW-compatible healthy VPN sources'; git push origin HEAD:main; fi

name: Update VPN Sources
on:
  schedule:
    - cron: '15 2 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Run the configured multi-source scan now'
        required: false
        default: true
        type: boolean
permissions:
  contents: write
concurrency:
  group: auto-vpnlink-update
  cancel-in-progress: true
jobs:
  scan:
    name: Scan, health-check and publish sources
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run multi-source scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scanner.py
      - name: Convert discovered nodes to Clash config
        run: python converter.py
      - name: Install latest Mihomo for real protocol checks
        run: |
          set -euo pipefail
          mkdir -p .bin
          API='https://api.github.com/repos/MetaCubeX/mihomo/releases/latest'
          URL=$(curl -fsSL "$API" | python -c "import json,sys; d=json.load(sys.stdin); print(next((a['browser_download_url'] for a in d.get('assets',[]) if 'linux-amd64' in a['name'] and a['name'].endswith('.gz')), ''))")
          test -n "$URL"
          echo "Downloading $URL"
          curl -fL --retry 3 "$URL" -o .bin/mihomo.gz
          gzip -df .bin/mihomo.gz
          mv .bin/mihomo* .bin/mihomo
          chmod +x .bin/mihomo
          .bin/mihomo -v
      - name: Run real protocol-level health checks
        env:
          MIHOMO_BIN: ${{ github.workspace }}/.bin/mihomo
          HEALTHCHECK_MAX: '150'
          HEALTHCHECK_TIMEOUT: '12'
        run: python healthcheck.py
      - name: Publish only protocol-verified nodes
        run: |
          set -e
          if [ -s output/health-checked-nodes.txt ]; then
            cp output/health-checked-nodes.txt output/verified-nodes.txt
            python converter.py
          else
            echo 'No protocol-verified nodes; refusing to replace the previous published node set.'
            exit 1
          fi
      - name: Show generated files and validate counts
        run: |
          set -e
          echo '=== Generated output ==='
          find output -maxdepth 2 -type f -print | sort
          echo '=== Health check ==='
          cat output/healthcheck.json
          echo '=== Counts ==='
          python - <<'PY'
          import json, yaml
          from pathlib import Path
          c=yaml.safe_load(Path('output/clash.yaml').read_text(encoding='utf-8')) or {}
          h=json.loads(Path('output/healthcheck.json').read_text(encoding='utf-8'))
          print('health-tested:', h.get('tested'))
          print('health-healthy:', h.get('healthy'))
          print('health-failed:', h.get('failed'))
          print('clash proxies:', len(c.get('proxies') or []))
          assert len(c.get('proxies') or []) == h.get('healthy'), 'published Clash count does not match health-check count'
          PY
      - name: Commit generated results safely
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf /tmp/auto-vpnlink-output
          cp -a output /tmp/auto-vpnlink-output
          git fetch origin main
          git reset --hard origin/main
          rm -rf output
          cp -a /tmp/auto-vpnlink-output output
          git add output/
          if git diff --cached --quiet; then
            echo 'No output changes.'
          else
            git commit -m 'auto: publish protocol-verified VPN sources'
            git push origin HEAD:main
          fi

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="检测当前公网 IP 所属国家、地区、城市、ISP、ASN、时区等信息">
<title>网络国家 / 地区检测</title>
<link rel="icon" id="country-favicon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e5e7eb'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;background:linear-gradient(135deg,#eef2f7,#f8fafc);color:#111827}.card{width:460px;max-width:100%;padding:34px 28px 25px;background:#fff;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.10);text-align:center}.title{margin:0;font-size:27px;font-weight:750;line-height:1.35}.subtitle{margin-top:8px;color:#6b7280;font-size:14px}.flag-area{height:155px;margin-top:20px;display:flex;align-items:center;justify-content:center}#flag{display:none;width:150px;height:100px;object-fit:contain;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14)}.spinner{width:44px;height:44px;border:4px solid #e5e7eb;border-top-color:#111827;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#country{min-height:43px;margin-top:4px;font-size:30px;font-weight:750}#iso{display:none;margin-top:12px;padding:6px 15px;border-radius:999px;background:#f3f4f6;color:#374151;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:16px;font-weight:700;letter-spacing:1px}#ip{margin-top:12px;padding:8px 14px;border-radius:10px;background:#f8fafc;color:#374151;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:15px;font-weight:700;word-break:break-all}#ip-details{display:none;margin-top:12px;border:1px solid #eee;border-radius:12px;overflow:hidden;background:#fafafa;text-align:left}.detail-flag-header{display:flex;align-items:center;justify-content:center;padding:12px;background:#fff;border-bottom:1px solid #eee}#detail-country-flag{width:42px;height:42px;display:none;object-fit:contain}.ip-detail-row{display:flex;align-items:center;gap:12px;min-height:34px;padding:7px 12px;border-bottom:1px solid #eee}.ip-detail-row:last-child{border-bottom:none}.ip-detail-label{flex:0 0 72px;color:#6b7280;font-size:12px;white-space:nowrap}.ip-detail-value{flex:1;min-width:0;color:#374151;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;font-weight:600;word-break:break-all;text-align:right}.api-status{margin-top:10px;padding:7px 10px;border-radius:8px;background:#f8fafc;color:#6b7280;font-size:11px}#status{min-height:48px;margin-top:20px;color:#6b7280;font-size:14px;line-height:1.7}.success{color:#16a34a!important}.error{color:#dc2626!important}button{width:100%;margin-top:12px;padding:12px 20px;border:0;border-radius:11px;background:#111827;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s}button:hover{opacity:.88}button:active{transform:scale(.98)}button:disabled{opacity:.5;cursor:not-allowed}.footer{margin-top:20px;padding-top:15px;border-top:1px solid #eee;color:#9ca3af;font-size:12px;line-height:1.6}@media(max-width:480px){body{padding:15px}.card{padding:28px 22px 24px}.title{font-size:24px}#country{font-size:27px}}
</style>
</head>
<body>
<div class="card">
<h1 class="title">网络国家 / 地区检测</h1>
<div class="subtitle">检测当前公网 IP 所属国家或地区</div>
<div class="flag-area"><div id="loading" class="spinner"></div><img id="flag" alt="国家 / 地区国旗"></div>
<div id="country">检测中...</div><div id="iso"></div><div id="ip">IP：检测中...</div>
<div id="ip-details"><div class="detail-flag-header"><img id="detail-country-flag" alt="国家旗帜"></div>
<div class="ip-detail-row"><span class="ip-detail-label">国家</span><span class="ip-detail-value" id="detail-country">—</span></div>
<div class="ip-detail-row"><span class="ip-detail-label">国家代码</span><span class="ip-detail-value" id="detail-countryCode">—</span></div>
<div class="ip-detail-row"><span class="ip-detail-label">地区代码</span><span class="ip-detail-value" id="detail-region">—</span></div>
<div class="ip-detail-row"><span class="ip-detail-label">地区名称</span><span class="ip-detail-value" id="detail-regionName">—</span></div>
<div class="ip-detail-row"><span class="ip-detail-label">城市</span><span class="ip-detail-value" id="detail-city">—</span></div>
<div class="ip-detail-row"><span class="ip-detail-label">邮编</span><span class="ip-detail-value" id="detail-zip">—</span></div>
<div class="ip-detail-row"><span class="ip-detail-label">纬度</span><span class="ip-detail-value" id="detail-lat">—</span></div>
<div class="ip-detail-row"><span class="ip-detail-label">经度</span><span class="ip-detail-value" id="detail-lon">—</span></div>
<div class="ip-detail-row"><span class="ip-detail-label">时区</span><span class="ip-detail-value" id="detail-timezone">—</span></div>
<div class="ip-detail-row"><span class="ip-detail-label">ISP</span><span class="ip-detail-value" id="detail-isp">—</span></div>
<div class="ip-detail-row"><span class="ip-detail-label">组织</span><span class="ip-detail-value" id="detail-org">—</span></div>
<div class="ip-detail-row"><span class="ip-detail-label">ASN</span><span class="ip-detail-value" id="detail-as">—</span></div></div>
<div id="api-status" class="api-status">定位服务：检测中</div><div id="status">正在检测当前网络...</div>
<button id="refresh" type="button">重新检测</button><button id="copy-url" type="button">复制当前 URL 到剪贴板</button>
<div class="footer">公网 IP / 国家定位：多源 HTTPS API · 国旗：多源 API · 圆形国旗：Circle Flags</div>
</div>
<script>
"use strict";
const API_TIMEOUT=8000,API_LIST=[
{name:"IPWho.is",url:"https://ipwho.is/",type:"ipwhois"},
{name:"ipapi.co",url:"https://ipapi.co/json/",type:"ipapico"},
{name:"GeoJS",url:"https://get.geojs.io/v1/ip/geo.json",type:"geojs"},
{name:"IPinfo",url:"https://ipinfo.io/json",type:"ipinfo"}];
const $=id=>document.getElementById(id),loading=$("loading"),flag=$("flag"),country=$("country"),iso=$("iso"),ip=$("ip"),status=$("status"),refresh=$("refresh"),copyURLButton=$("copy-url"),favicon=$("country-favicon"),ipDetails=$("ip-details"),detailCountryFlag=$("detail-country-flag"),apiStatus=$("api-status");
const detailFields={country:$("detail-country"),countryCode:$("detail-countryCode"),region:$("detail-region"),regionName:$("detail-regionName"),city:$("detail-city"),zip:$("detail-zip"),lat:$("detail-lat"),lon:$("detail-lon"),timezone:$("detail-timezone"),isp:$("detail-isp"),org:$("detail-org"),as:$("detail-as")};
function clean(v){return String(v==null?"":v).replace(/[\r\n\t]/g,"").trim()}function detailValue(v){const s=clean(v);return s||"—"}function validISO(v){return/^[A-Z]{2}$/.test(v)}
function withTimeout(url){return new Promise((resolve,reject)=>{const c=new AbortController(),t=setTimeout(()=>{c.abort();reject(new Error("请求超时"))},API_TIMEOUT);fetch(url,{method:"GET",cache:"no-store",signal:c.signal,headers:{Accept:"application/json"}}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(resolve).catch(reject).finally(()=>clearTimeout(t))})}
function normalizeIPWhois(d){if(!d||d.success===false)throw new Error(d?.message||"IPWho.is 返回失败");const c=d.connection||{},z=d.timezone||{};return{ip:d.ip,country:d.country,countryCode:d.country_code,region:d.region_code,regionName:d.region,city:d.city,zip:d.postal,lat:d.latitude,lon:d.longitude,timezone:z.id||z.abbr,isp:c.isp,org:c.org,as:c.asn?("AS"+String(c.asn).replace(/^AS/i,"")):""}}
function normalizeIPApiCo(d){if(!d||d.error)throw new Error(d?.reason||d?.message||"ipapi.co 返回失败");return{ip:d.ip,country:d.country_name,countryCode:d.country_code,region:d.region_code,regionName:d.region,city:d.city,zip:d.postal,lat:d.latitude,lon:d.longitude,timezone:d.timezone,isp:d.org,org:d.org,as:d.asn}}
function normalizeGeoJS(d){if(!d||!d.country)throw new Error("GeoJS 返回数据无效");return{ip:d.ip,country:d.country,countryCode:d.country_code,region:d.region_code,regionName:d.region,city:d.city,zip:d.postal,lat:d.latitude,lon:d.longitude,timezone:d.timezone,isp:d.organization,org:d.organization,as:d.asn}}
function normalizeIPinfo(d){if(!d||!d.country)throw new Error("IPinfo 返回数据无效");const org=clean(d.org),as=(org.match(/\bAS\d+\b/i)||[""])[0];return{ip:d.ip,country:d.country,countryCode:d.country,region:d.region,regionName:d.region,city:d.city,zip:d.postal,lat:d.loc?d.loc.split(",")[0]:"",lon:d.loc?d.loc.split(",")[1]:"",timezone:d.timezone,isp:org,org:org,as:as}}
function normalize(raw,type){let d;if(type==="ipwhois")d=normalizeIPWhois(raw);else if(type==="ipapico")d=normalizeIPApiCo(raw);else if(type==="geojs")d=normalizeGeoJS(raw);else d=normalizeIPinfo(raw);d.country=clean(d.country);d.countryCode=clean(d.countryCode).toUpperCase();if(!d.country||!validISO(d.countryCode))throw new Error("国家信息无效");d._api=API_LIST.find(x=>x.type===type)?.name||type;return d}
async function requestIPData(){apiStatus.textContent="定位服务：正在并行检测";const jobs=API_LIST.map(api=>withTimeout(api.url).then(raw=>normalize(raw,api.type)).catch(e=>{console.warn(api.name+" 失败",e);throw e}));try{const data=await Promise.any(jobs);apiStatus.textContent="定位服务："+data._api+"（成功）";return data}catch(e){apiStatus.textContent="定位服务：全部失败";throw new Error("所有 HTTPS IP 定位服务均失败")}}
function flagURLs(code){const c=code.toLowerCase();return["https://flagcdn.com/"+c+".svg","https://hatscripts.github.io/circle-flags/flags/"+c+".svg","https://flagsapi.com/"+code+"/flat/64.png"]}
function loadImage(url,timeout=5000){return new Promise(resolve=>{const img=new Image();let done=false;const finish=v=>{if(done)return;done=true;clearTimeout(t);resolve(v)},t=setTimeout(()=>finish(null),timeout);img.onload=()=>finish(url);img.onerror=()=>finish(null);img.src=url+"?t="+Date.now()})}
async function loadFlag(code){for(const url of flagURLs(code)){const ok=await loadImage(url);if(ok)return ok}return null}
function updateFavicon(code){favicon.href="https://hatscripts.github.io/circle-flags/flags/"+code.toLowerCase()+".svg"}
function updateDetailFlag(code){detailCountryFlag.style.display="none";detailCountryFlag.onload=()=>detailCountryFlag.style.display="block";detailCountryFlag.onerror=()=>detailCountryFlag.style.display="none";detailCountryFlag.src="https://hatscripts.github.io/circle-flags/flags/"+code.toLowerCase()+".svg?t="+Date.now()}
function displayDetails(d){detailFields.country.textContent=detailValue(d.country);detailFields.countryCode.textContent=detailValue(d.countryCode);detailFields.region.textContent=detailValue(d.region);detailFields.regionName.textContent=detailValue(d.regionName);detailFields.city.textContent=detailValue(d.city);detailFields.zip.textContent=detailValue(d.zip);detailFields.lat.textContent=d.lat==null||d.lat===""?"—":String(d.lat);detailFields.lon.textContent=d.lon==null||d.lon===""?"—":String(d.lon);detailFields.timezone.textContent=detailValue(d.timezone);detailFields.isp.textContent=detailValue(d.isp);detailFields.org.textContent=detailValue(d.org);detailFields.as.textContent=detailValue(d.as);updateDetailFlag(d.countryCode);ipDetails.style.display="block"}
function resetPage(){loading.style.display="block";flag.style.display="none";iso.style.display="none";ipDetails.style.display="none";detailCountryFlag.style.display="none";country.textContent="检测中...";ip.textContent="IP：检测中...";status.textContent="正在检测当前网络...";status.className="";apiStatus.textContent="定位服务：检测中";favicon.href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e5e7eb'/%3E%3C/svg%3E"}
let detectionID=0;
async function detectNetwork(){const id=++detectionID;refresh.disabled=true;resetPage();try{const d=await requestIPData();if(id!==detectionID)return;country.textContent=clean(d.country);iso.textContent=d.countryCode;iso.style.display="inline-block";ip.textContent=clean(d.ip)?"IP："+clean(d.ip):"IP：未返回";displayDetails(d);updateFavicon(d.countryCode);status.textContent="正在加载国旗...";const url=await loadFlag(d.countryCode);if(id!==detectionID)return;loading.style.display="none";if(url){flag.src=url;flag.style.display="block"}status.textContent="检测完成 · "+d._api+(url?"":" · 国旗加载失败");status.className="success"}catch(e){if(id!==detectionID)return;loading.style.display="none";flag.style.display="none";ipDetails.style.display="none";country.textContent="检测失败";ip.textContent="IP：无法获取";status.innerHTML="所有 HTTPS IP 定位服务均无法连接。<br>请检查当前网络、VPN 或浏览器网络权限。";status.className="error";console.error(e)}finally{if(id===detectionID)refresh.disabled=false}}
async function copyUrlToClipboard(){const url=location.href;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(url);else{const ta=document.createElement("textarea");ta.value=url;ta.style.position="fixed";ta.style.left="-9999px";document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}const old=copyURLButton.textContent;copyURLButton.textContent="已复制";setTimeout(()=>copyURLButton.textContent=old,1500)}catch(e){alert("复制失败，请手动复制地址栏中的 URL：\n\n"+url)}}
refresh.addEventListener("click",detectNetwork);copyURLButton.addEventListener("click",copyUrlToClipboard);detectNetwork();
</script>
</body>
</html>

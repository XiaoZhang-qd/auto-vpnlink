<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="检测当前公网 IP 所属国家、地区、城市、ISP、ASN、时区等信息">
<title>网络国家 / 地区检测</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e5e7eb'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;color:#111827}body{min-height:100vh;padding:20px;background:linear-gradient(135deg,#eef2f7,#f8fafc);display:flex;justify-content:center;align-items:center}.card{width:470px;max-width:100%;padding:32px 28px 24px;background:#fff;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.1);text-align:center}.title{margin:0;font-size:27px;font-weight:750}.subtitle{margin:8px 0 16px;color:#6b7280;font-size:14px}.flag-area{height:150px;display:flex;align-items:center;justify-content:center}.spinner{width:44px;height:44px;border:4px solid #e5e7eb;border-top-color:#111827;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#flag{display:none;width:150px;height:100px;object-fit:contain;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14)}#country{min-height:43px;font-size:30px;font-weight:750}#iso{display:none;margin-top:10px;padding:6px 15px;border-radius:999px;background:#f3f4f6;font:700 16px ui-monospace,monospace;letter-spacing:1px}#ip{margin-top:12px;padding:9px 14px;border-radius:10px;background:#f8fafc;font:700 14px ui-monospace,monospace;word-break:break-all}.details{display:none;margin-top:12px;border:1px solid #eee;border-radius:12px;overflow:hidden;background:#fafafa;text-align:left}.detail-flag{padding:12px;text-align:center;background:#fff;border-bottom:1px solid #eee}.detail-flag img{width:42px;height:42px;display:none}.row{display:flex;gap:10px;padding:7px 12px;border-bottom:1px solid #eee;min-height:34px}.row:last-child{border:0}.label{flex:0 0 72px;color:#6b7280;font-size:12px}.value{flex:1;min-width:0;text-align:right;word-break:break-all;font:600 12px ui-monospace,monospace}.api{margin-top:10px;padding:7px 10px;background:#f8fafc;border-radius:8px;color:#6b7280;font-size:11px}#status{min-height:45px;margin-top:18px;color:#6b7280;font-size:14px;line-height:1.7}.success{color:#16a34a!important}.error{color:#dc2626!important}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}button,.nav{width:100%;padding:12px 10px;border:0;border-radius:11px;background:#111827;color:#fff;font-size:14px;font-weight:650;text-decoration:none;cursor:pointer}button:hover,.nav:hover{opacity:.88}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#f3f4f6;color:#111827}.footer{margin-top:20px;padding-top:15px;border-top:1px solid #eee;color:#9ca3af;font-size:12px;line-height:1.6}@media(max-width:500px){body{padding:15px}.card{padding:28px 20px 22px}.title{font-size:24px}#country{font-size:27px}.buttons{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="card">
<h1 class="title">网络国家 / 地区检测</h1>
<div class="subtitle">检测当前公网 IP 所属国家或地区</div>
<div class="flag-area"><div id="loading" class="spinner"></div><img id="flag" alt="国家 / 地区国旗"></div>
<div id="country">检测中...</div><div id="iso"></div><div id="ip">IP：检测中...</div>
<div id="details" class="details"><div class="detail-flag"><img id="detailFlag" alt="国家旗帜"></div>
<div class="row"><span class="label">国家</span><span class="value" id="d-country">—</span></div>
<div class="row"><span class="label">国家代码</span><span class="value" id="d-code">—</span></div>
<div class="row"><span class="label">地区代码</span><span class="value" id="d-region">—</span></div>
<div class="row"><span class="label">地区名称</span><span class="value" id="d-regionName">—</span></div>
<div class="row"><span class="label">城市</span><span class="value" id="d-city">—</span></div>
<div class="row"><span class="label">邮编</span><span class="value" id="d-zip">—</span></div>
<div class="row"><span class="label">纬度</span><span class="value" id="d-lat">—</span></div>
<div class="row"><span class="label">经度</span><span class="value" id="d-lon">—</span></div>
<div class="row"><span class="label">时区</span><span class="value" id="d-timezone">—</span></div>
<div class="row"><span class="label">ISP</span><span class="value" id="d-isp">—</span></div>
<div class="row"><span class="label">组织</span><span class="value" id="d-org">—</span></div>
<div class="row"><span class="label">ASN</span><span class="value" id="d-asn">—</span></div></div>
<div id="api" class="api">定位服务：检测中</div><div id="status">正在检测当前网络...</div>
<div class="buttons"><button id="refresh">重新检测</button><a class="nav secondary" href="./subscriptions.html" target="_blank" rel="noopener">VPN 订阅链接</a></div>
<div class="buttons"><a class="nav secondary" href="https://github.com/XiaoZhang-qd/auto-vpnlink" target="_blank" rel="noopener">打开项目仓库</a><button id="copy">复制当前 URL</button></div>
<div class="footer">公网 IP / 国家定位：多源 HTTPS API · 国旗：多源 API · VPN 订阅：自动生成</div>
</main>
<script>
'use strict';
const TIMEOUT=8000;
const APIS=[
 {name:'IPWho.is',url:'https://ipwho.is/',parse:d=>{if(!d||d.success===false)throw 0;const c=d.connection||{},z=d.timezone||{};return {ip:d.ip,country:d.country,code:d.country_code,region:d.region_code,regionName:d.region,city:d.city,zip:d.postal,lat:d.latitude,lon:d.longitude,timezone:z.id||z.abbr,isp:c.isp,org:c.org,asn:c.asn?('AS'+String(c.asn).replace(/^AS/i,'')):''}}},
 {name:'ipapi.co',url:'https://ipapi.co/json/',parse:d=>{if(!d||d.error)throw 0;return {ip:d.ip,country:d.country_name,code:d.country_code,region:d.region_code,regionName:d.region,city:d.city,zip:d.postal,lat:d.latitude,lon:d.longitude,timezone:d.timezone,isp:d.org,org:d.org,asn:d.asn}}},
 {name:'GeoJS',url:'https://get.geojs.io/v1/ip/geo.json',parse:d=>{if(!d||!d.country)throw 0;return {ip:d.ip,country:d.country,code:d.country_code,region:d.region_code,regionName:d.region,city:d.city,zip:d.postal,lat:d.latitude,lon:d.longitude,timezone:d.timezone,isp:d.organization,org:d.organization,asn:d.asn}}},
 {name:'IPinfo',url:'https://ipinfo.io/json',parse:d=>{if(!d||!d.country)throw 0;const p=(d.loc||'').split(','),org=d.org||'',m=org.match(/\bAS\d+\b/i);return {ip:d.ip,country:d.country,code:d.country,region:d.region,regionName:d.region,city:d.city,zip:d.postal,lat:p[0],lon:p[1],timezone:d.timezone,isp:org,org:org,asn:m?m[0]:''}}}
];
const $=id=>document.getElementById(id), loading=$('loading'),flag=$('flag'),country=$('country'),iso=$('iso'),ip=$('ip'),details=$('details'),detailFlag=$('detailFlag'),api=$('api'),status=$('status'),refresh=$('refresh');
const fields={country:$('d-country'),code:$('d-code'),region:$('d-region'),regionName:$('d-regionName'),city:$('d-city'),zip:$('d-zip'),lat:$('d-lat'),lon:$('d-lon'),timezone:$('d-timezone'),isp:$('d-isp'),org:$('d-org'),asn:$('d-asn')};
const clean=v=>String(v==null?'':v).replace(/[\r\n\t]/g,'').trim();
const value=v=>clean(v)||'—';
function fetchJSON(url){return new Promise((resolve,reject)=>{const c=new AbortController(),t=setTimeout(()=>{c.abort();reject(new Error('timeout'))},TIMEOUT);fetch(url,{signal:c.signal,cache:'no-store',headers:{Accept:'application/json'}}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(resolve).catch(reject).finally(()=>clearTimeout(t))})}
async function detectData(){api.textContent='定位服务：正在并行检测';const jobs=APIS.map(a=>fetchJSON(a.url).then(raw=>{const d=a.parse(raw);d.code=clean(d.code).toUpperCase();d.country=clean(d.country);if(!/^[A-Z]{2}$/.test(d.code)||!d.country)throw new Error('invalid');d.source=a.name;return d}));return Promise.any(jobs)}
function setDetails(d){Object.keys(fields).forEach(k=>fields[k].textContent=value(d[k]));details.style.display='block';detailFlag.style.display='none';detailFlag.onload=()=>detailFlag.style.display='inline-block';detailFlag.src='https://hatscripts.github.io/circle-flags/flags/'+d.code.toLowerCase()+'.svg?t='+Date.now()}
function flagList(code){const c=code.toLowerCase();return ['https://flagcdn.com/'+c+'.svg','https://hatscripts.github.io/circle-flags/flags/'+c+'.svg','https://flagsapi.com/'+code+'/flat/64.png']}
function testImage(url){return new Promise(resolve=>{const i=new Image(),t=setTimeout(()=>resolve(null),5000);i.onload=()=>{clearTimeout(t);resolve(url)};i.onerror=()=>{clearTimeout(t);resolve(null)};i.src=url+'?t='+Date.now()})}
async function loadFlag(code){for(const u of flagList(code)){const ok=await testImage(u);if(ok)return ok}return null}
let run=0;
async function detect(){const my=++run;refresh.disabled=true;loading.style.display='block';flag.style.display='none';details.style.display='none';iso.style.display='none';country.textContent='检测中...';ip.textContent='IP：检测中...';status.textContent='正在连接多源 IP 定位服务...';status.className='';api.textContent='定位服务：检测中';try{const d=await detectData();if(my!==run)return;api.textContent='定位服务：'+d.source+'（成功）';country.textContent=d.country;iso.textContent=d.code;iso.style.display='inline-block';ip.textContent='IP：'+value(d.ip);setDetails(d);document.getElementById('favicon').href='https://hatscripts.github.io/circle-flags/flags/'+d.code.toLowerCase()+'.svg';status.textContent='正在加载国旗...';const u=await loadFlag(d.code);if(my!==run)return;loading.style.display='none';if(u){flag.src=u;flag.style.display='block'}status.textContent='检测完成'+(u?'':' · 国旗加载失败');status.className='success'}catch(e){if(my!==run)return;loading.style.display='none';country.textContent='检测失败';ip.textContent='IP：无法获取';status.innerHTML='所有 HTTPS IP 定位服务均无法连接。<br>请检查当前网络、VPN 或浏览器网络权限。';status.className='error';api.textContent='定位服务：全部失败';console.error(e)}finally{if(my===run)refresh.disabled=false}}
$('refresh').addEventListener('click',detect);
$('copy').addEventListener('click',async()=>{const text=location.href;try{if(navigator.clipboard&&isSecureContext)await navigator.clipboard.writeText(text);else{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.left='-9999px';document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}const b=$('copy'),old=b.textContent;b.textContent='已复制';setTimeout(()=>b.textContent=old,1200)}catch(e){alert('复制失败，请手动复制地址栏 URL：\n'+text)}});
detect();
</script>
</body>
</html>

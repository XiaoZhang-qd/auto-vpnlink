<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;

}

body {

/* =========================================================
   卡片
========================================================= */

.card {

    width: 460px;

    max-width: 100%;

    padding: 34px 28px 25px;

    background: #ffffff;

    border-radius: 24px;

    box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.10);

    text-align: center;
}


/* =========================================================
   标题
========================================================= */

.title {

    margin: 0;

    font-size: 27px;

    line-height: 1.35;
}


.subtitle {

    margin-top: 8px;

    color: #6b7280;

    font-size: 14px;
}


/* =========================================================
   国旗
========================================================= */

.flag-area {

    height: 155px;

    margin-top: 20px;

    display: flex;

    align-items: center;

    justify-content: center;
}


#flag {

    display: none;

========================================================= */

        spin 0.8s linear infinite;

@keyframes spin {

}

========================================================= */

}


/* =========================================================
   ISO
========================================================= */

========================================================= */

        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

    font-size: 15px;

    font-weight: 700;

    word-break: break-all;
}


/* =========================================================
   IP 详细信息
========================================================= */

#ip-details {

    display: none;

    margin-top: 12px;

    border:
        1px solid #eeeeee;

    border-radius: 12px;

    overflow: hidden;

    background: #fafafa;

    text-align: left;
}


/* =========================================================
   详情顶部国旗
========================================================= */

.detail-flag-header {

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 12px;

    background: #ffffff;

    border-bottom:
        1px solid #eeeeee;
}


#detail-country-flag {

    width: 42px;

    height: 42px;

    display: none;

    object-fit: contain;
}


/* =========================================================
   IP 信息行
========================================================= */

.ip-detail-row {

    display: flex;

    align-items: center;

    gap: 12px;

    min-height: 34px;

    padding:
        7px 12px;

    border-bottom:
        1px solid #eeeeee;
}


.ip-detail-row:last-child {

    border-bottom:
        none;
}


.ip-detail-label {

    flex:
        0 0 72px;

    color: #6b7280;

    font-size: 12px;

    white-space: nowrap;
}


.ip-detail-value {

    flex: 1;

    min-width: 0;

    color: #374151;

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

    font-size: 12px;

    font-weight: 600;

    word-break: break-all;

    text-align: right;
}


/* =========================================================
   API 状态
========================================================= */

.api-status {

    margin-top: 10px;

    padding: 7px 10px;

    border-radius: 8px;

    background: #f8fafc;

    color: #9ca3af;

    font-size: 11px;
}


/* =========================================================
   状态
========================================================= */

#status {

    min-height: 48px;

    margin-top: 20px;

    color: #6b7280;

    font-size: 14px;

    line-height: 1.7;
}


.success {

    color: #16a34a !important;
}


.error {

    color: #dc2626 !important;
}


/* =========================================================
   按钮
========================================================= */

button {

    width: 100%;

    margin-top: 12px;

    padding: 12px 20px;

    border: none;

    border-radius: 11px;

    background: #111827;

    color: #ffffff;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

    transition:
        opacity 0.15s,
        transform 0.1s;
}


button:hover {

    opacity: 0.88;
}


button:active {

    transform: scale(0.98);
}


button:disabled {

    opacity: 0.5;

    cursor: not-allowed;
}


/* =========================================================
   底部
========================================================= */

.footer {

    margin-top: 20px;

    padding-top: 15px;

    border-top:
        1px solid #eeeeee;

    color: #9ca3af;

    font-size: 12px;

    line-height: 1.6;
}


/* =========================================================
   手机
========================================================= */

@media (max-width: 480px) {

    body {
        padding: 15px;
    }

    .card {
        padding: 28px 22px 24px;
    }

    .title {
        font-size: 24px;
    }

    #country {
        font-size: 27px;
    }

}

</style>

<script>


/* =========================================================
   配置
========================================================= */

const API_TIMEOUT = 8000;


/*
 * 多源 HTTPS IP 定位
 *
 * 第一优先：
 * IPWho.is
 *
 * 第二：
 * ipapi.co
 *
 * 第三：
 * GeoJS
 */

const IP_APIS = [

    {
        name: "IPWho.is",
        url: "https://ipwho.is/",
        type: "ipwhois"
    },

    {
        name: "ipapi.co",
        url: "https://ipapi.co/json/",
        type: "ipapico"
    },

    {
        name: "GeoJS",
        url: "https://get.geojs.io/v1/ip/geo.json",
        type: "geojs"
    }

];


/* =========================================================
   DOM
========================================================= */

const loading =
    document.getElementById(
        "loading"
    );

const flag =
    document.getElementById(
        "flag"
    );

const country =
    document.getElementById(
        "country"
    );

const iso =
    document.getElementById(
        "iso"
    );

const ip =
    document.getElementById(
        "ip"
    );

const status =
    document.getElementById(
        "status"
    );

const refresh =
    document.getElementById(
        "refresh"
    );

const copyURLButton =
    document.getElementById(
        "copy-url"
    );

const favicon =
    document.getElementById(
        "country-favicon"
    );

const ipDetails =
    document.getElementById(
        "ip-details"
    );

const detailCountryFlag =
    document.getElementById(
        "detail-country-flag"
    );

const apiStatus =
    document.getElementById(
        "api-status"
    );


/* =========================================================
   详情字段
========================================================= */

const detailFields = {

    country:
        document.getElementById(
            "detail-country"
        ),

    countryCode:
        document.getElementById(
            "detail-countryCode"
        ),

    region:
        document.getElementById(
            "detail-region"
        ),

    regionName:
        document.getElementById(
            "detail-regionName"
        ),

    city:
        document.getElementById(
            "detail-city"
        ),

    zip:
        document.getElementById(
            "detail-zip"
        ),

    lat:
        document.getElementById(
            "detail-lat"
        ),

    lon:
        document.getElementById(
            "detail-lon"
        ),

    timezone:
        document.getElementById(
            "detail-timezone"
        ),

    isp:
        document.getElementById(
            "detail-isp"
        ),

    org:
        document.getElementById(
            "detail-org"
        ),

    as:
        document.getElementById(
            "detail-as"
        )

};


/* =========================================================
   清理字符串
========================================================= */

function clean(value) {

    return String(
        value == null
            ? ""
            : value
    )
    .replace(
        /[\r\n\t]/g,
        ""
    )
    .trim();

}


/* =========================================================
   ISO 验证
========================================================= */

function validISO(value) {

    return /^[A-Z]{2}$/.test(
        value
    );

}


/* =========================================================
   详情值
========================================================= */

function detailValue(value) {

    const result =
        clean(value);

    return result
        ? result
        : "—";

}


/* =========================================================
   超时 Fetch
========================================================= */

async function fetchJSON(
    url
) {

    const controller =
        new AbortController();

    const timeout =
        setTimeout(
            function() {

                controller.abort();

            },
            API_TIMEOUT
        );


    try {

        const response =
            await fetch(
                url,
                {
                    method: "GET",

                    cache: "no-store",

                    signal:
                        controller.signal,

                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        return await response.json();

    }

    finally {

        clearTimeout(
            timeout
        );

    }

}


/* =========================================================
   IPWho.is 数据转换
========================================================= */

function normalizeIPWhoIs(
    data
) {

    if (
        !data ||
        data.success === false
    ) {

        throw new Error(
            data &&
            data.message
                ? data.message
                : "IPWho.is 返回失败"
        );

    }


    const connection =
        data.connection || {};


    const timezone =
        data.timezone || {};


    return {

        ip:
            data.ip,

        country:
            data.country,

        countryCode:
            data.country_code,

        region:
            data.region,

        regionCode:
            data.region_code,

        regionName:
            data.region,

        city:
            data.city,

        zip:
            data.postal,

        lat:
            data.latitude,

        lon:
            data.longitude,

        timezone:
            timezone.id ||
            timezone.abbr,

        isp:
            connection.isp,

        org:
            connection.org,

        as:
            connection.asn
                ? (
                    String(
                        connection.asn
                    )
                    .toUpperCase()
                    .startsWith("AS")
                        ? connection.asn
                        : "AS" +
                          connection.asn
                )
                : ""

    };

}


/* =========================================================
   ipapi.co 数据转换
========================================================= */

function normalizeIPApiCo(
    data
) {

    if (
        !data ||
        data.error
    ) {

        throw new Error(
            data &&
            (
                data.reason ||
                data.message
            )
                ? (
                    data.reason ||
                    data.message
                )
                : "ipapi.co 返回失败"
        );

    }


    const countryCode =
        data.country_code ||
        data.country;


    return {

        ip:
            data.ip,

        country:
            data.country_name,

        countryCode:
            countryCode,

        region:
            data.region_code,

        regionCode:
            data.region_code,

        regionName:
            data.region,

        city:
            data.city,

        zip:
            data.postal,

        lat:
            data.latitude,

        lon:
            data.longitude,

        timezone:
            data.timezone,

        isp:
            data.org,

        org:
            data.org,

        as:
            data.asn

    };

}


/* =========================================================
   GeoJS 数据转换
========================================================= */

function normalizeGeoJS(
    data
) {

    if (
        !data ||
        !data.country
    ) {

        throw new Error(
            "GeoJS 返回数据无效"
        );

    }


    return {

        ip:
            data.ip,

        country:
            data.country,

        countryCode:
            data.country_code,

        region:
            data.region,

        regionCode:
            data.region_code,

        regionName:
            data.region,

        city:
            data.city,

        zip:
            data.postal,

        lat:
            data.latitude,

        lon:
            data.longitude,

        timezone:
            data.timezone,

        isp:
            data.organization,

        org:
            data.organization,

        as:
            data.asn

    };

}


/* =========================================================
   统一 API 数据
========================================================= */

function normalizeData(
    data,
    type
) {

    let result;


    switch (type) {

        case "ipwhois":

            result =
                normalizeIPWhoIs(
                    data
                );

            break;


        case "ipapico":

            result =
                normalizeIPApiCo(
                    data
                );

            break;


        case "geojs":

            result =
                normalizeGeoJS(
                    data
                );

            break;


        default:

            throw new Error(
                "未知 API 类型"
            );

    }


    /*
     * 统一国家代码
     */

    result.countryCode =
        clean(
            result.countryCode
        ).toUpperCase();


    /*
     * 验证关键字段
     */

    if (
        !clean(result.country) ||
        !validISO(
            result.countryCode
        )
    ) {

        throw new Error(
            "API 返回的国家数据无效"
        );

    }


    return result;

}


/* =========================================================
   请求 IP 定位
========================================================= */

async function requestIPData() {

    let lastError =
        null;


    for (
        const api of IP_APIS
    ) {

        try {

            apiStatus.textContent =
                "定位服务：" +
                api.name +
                "（连接中）";


            status.textContent =
                "正在连接 " +
                api.name +
                "...";


            console.log(
                "正在尝试：",
                api.name
            );


            const raw =
                await fetchJSON(
                    api.url
                );


            const data =
                normalizeData(
                    raw,
                    api.type
                );


            data._api =
                api.name;


            apiStatus.textContent =
                "定位服务：" +
                api.name +
                "（成功）";


            console.log(
                api.name +
                " 返回：",
                data
            );


            return data;

        }

        catch (error) {

            lastError =
                error;


            console.warn(
                api.name +
                " 失败：",
                error
            );


            apiStatus.textContent =
                "定位服务：" +
                api.name +
                "（失败，切换备用）";

        }

    }


    throw (
        lastError ||
        new Error(
            "所有 API 均失败"
        )
    );

}


/* =========================================================
   国旗 URL
========================================================= */

function getFlagURLs(
    countryISO
) {

    const code =
        countryISO.toLowerCase();


    return [

        /*
         * FlagCDN
         */

        `https://flagcdn.com/${code}.svg`,


        /*
         * Circle Flags
         */

        `https://hatscripts.github.io/circle-flags/flags/${code}.svg`,


        /*
         * FlagsAPI
         */

        `https://flagsapi.com/${countryISO}/flat/64.png`

    ];

}


/* =========================================================
   加载国旗
========================================================= */

function loadFlag(
    countryISO
) {

    return new Promise(
        function(resolve) {

            const urls =
                getFlagURLs(
                    countryISO
                );


            let index =
                0;


            function next() {

                if (
                    index >=
                    urls.length
                ) {

                    resolve(
                        null
                    );

                    return;

                }


                const currentURL =
                    urls[index++];


                const image =
                    new Image();


                let finished =
                    false;


                const timer =
                    setTimeout(
                        function() {

                            if (
                                finished
                            ) {
                                return;
                            }


                            finished =
                                true;


                            next();

                        },
                        5000
                    );


                image.onload =
                    function() {

                        if (
                            finished
                        ) {
                            return;
                        }


                        finished =
                            true;


                        clearTimeout(
                            timer
                        );


                        resolve(
                            currentURL
                        );

                    };


                image.onerror =
                    function() {

                        if (
                            finished
                        ) {
                            return;
                        }


                        finished =
                            true;


                        clearTimeout(
                            timer
                        );


                        next();

                    };


                image.src =
                    currentURL +
                    (
                        currentURL.includes("?")
                            ? "&"
                            : "?"
                    ) +
                    "t=" +
                    Date.now();

            }


            next();

        }
    );

}


/* =========================================================
   显示国旗
========================================================= */

function displayFlag(
    imageURL
) {

    return new Promise(
        function(resolve) {

            if (
                !imageURL
            ) {

                resolve(
                    false
                );

                return;

            }


            flag.style.display =
                "none";


            flag.onload =
                function() {

                    flag.style.display =
                        "block";


                    resolve(
                        true
                    );

                };


            flag.onerror =
                function() {

                    flag.style.display =
                        "none";


                    resolve(
                        false
                    );

                };


            flag.src =
                imageURL;

        }
    );

}


/* =========================================================
   更新 Favicon
========================================================= */

function updateFavicon(
    countryISO
) {

    const code =
        countryISO.toLowerCase();


    favicon.href =
        `https://hatscripts.github.io/circle-flags/flags/${code}.svg`;

}


/* =========================================================
   更新详情国旗
========================================================= */

function updateDetailFlag(
    countryISO
) {

    const code =
        countryISO.toLowerCase();


    detailCountryFlag.style.display =
        "none";


    detailCountryFlag.onload =
        function() {

            detailCountryFlag.style.display =
                "block";

        };


    detailCountryFlag.onerror =
        function() {

            detailCountryFlag.style.display =
                "none";

        };


    detailCountryFlag.src =
        `https://hatscripts.github.io/circle-flags/flags/${code}.svg?t=${Date.now()}`;

}


/* =========================================================
   显示 IP 详细信息
========================================================= */

function displayIPDetails(
    data
) {

    detailFields.country.textContent =
        detailValue(
            data.country
        );


    detailFields.countryCode.textContent =
        detailValue(
            data.countryCode
        );


    detailFields.region.textContent =
        detailValue(
            data.regionCode
        );


    detailFields.regionName.textContent =
        detailValue(
            data.regionName
        );


    detailFields.city.textContent =
        detailValue(
            data.city
        );


    detailFields.zip.textContent =
        detailValue(
            data.zip
        );


    detailFields.lat.textContent =
        data.lat == null
            ? "—"
            : String(
                data.lat
            );


    detailFields.lon.textContent =
        data.lon == null
            ? "—"
            : String(
                data.lon
            );


    detailFields.timezone.textContent =
        detailValue(
            data.timezone
        );


    detailFields.isp.textContent =
        detailValue(
            data.isp
        );


    detailFields.org.textContent =
        detailValue(
            data.org
        );


    detailFields.as.textContent =
        detailValue(
            data.as
        );


    updateDetailFlag(
        data.countryCode
    );


    ipDetails.style.display =
        "block";

}


/* =========================================================
   重置页面
========================================================= */

function resetPage() {

    loading.style.display =
        "block";


    flag.style.display =
        "none";


    iso.style.display =
        "none";


    ipDetails.style.display =
        "none";


    detailCountryFlag.style.display =
        "none";


    country.textContent =
        "检测中...";


    ip.textContent =
        "IP：检测中...";


    status.textContent =
        "正在检测当前网络...";


    status.className =
        "";


    apiStatus.textContent =
        "定位服务：检测中";


    favicon.href =
        "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e5e7eb'/%3E%3C/svg%3E";

}


/* =========================================================
   主检测
========================================================= */

let detectionID =
    0;


async function detectNetwork() {

    const currentID =
        ++detectionID;


    refresh.disabled =
        true;


    resetPage();


    try {

        /*
         * ================================================
         * 获取 IP 数据
         * ================================================
         */

        const data =
            await requestIPData();


        /*
         * 如果期间开始了新的检测
         */

        if (
            currentID !==
            detectionID
        ) {

            return;

        }


        const countryName =
            clean(
                data.country
            );


        const countryISO =
            clean(
                data.countryCode
            ).toUpperCase();


        const publicIP =
            clean(
                data.ip
            );


        /*
         * ================================================
         * IP
         * ================================================
         */

        ip.textContent =
            publicIP
                ? "IP：" +
                  publicIP
                : "IP：未返回";


        /*
         * ================================================
         * 国家
         * ================================================
         */

        country.textContent =
            countryName;


        /*
         * ================================================
         * ISO
         * ================================================
         */

        iso.textContent =
            countryISO;


        iso.style.display =
            "inline-block";


        /*
         * ================================================
         * 详细信息
         * ================================================
         */

        displayIPDetails(
            data
        );


        /*
         * ================================================
         * Favicon
         * ================================================
         */

        updateFavicon(
            countryISO
        );


        /*
         * ================================================
         * 国旗
         * ================================================
         */

        status.textContent =
            "正在加载国旗...";


        const flagURL =
            await loadFlag(
                countryISO
            );


        if (
            currentID !==
            detectionID
        ) {

            return;

        }


        loading.style.display =
            "none";


        if (
            flagURL
        ) {

            const shown =
                await displayFlag(
                    flagURL
                );


            if (
                shown
            ) {

                status.textContent =
                    "检测完成 · " +
                    data._api;


                status.className =
                    "success";

            }

            else {

                status.textContent =
                    "检测完成 · 国旗加载失败";


                status.className =
                    "success";

            }

        }

        else {

            /*
             * 国旗失败不能影响
             * IP 定位结果
             */

            status.textContent =
                "检测完成 · " +
                data._api;


            status.className =
                "success";

        }

    }

    catch (error) {

        console.error(
            "检测失败：",
            error
        );


        if (
            currentID !==
            detectionID
        ) {

            return;

        }


        loading.style.display =
            "none";


        flag.style.display =
            "none";


        country.textContent =
            "检测失败";


        ip.textContent =
            "IP：无法获取";


        apiStatus.textContent =
            "定位服务：全部失败";


        status.innerHTML =
            "所有 HTTPS IP 定位服务均无法连接。<br>" +
            "请检查当前网络、VPN 或浏览器网络权限。";


        status.className =
            "error";

    }

    finally {

        if (
            currentID ===
            detectionID
        ) {

            refresh.disabled =
                false;

        }

    }

}


/* =========================================================
   复制 URL
========================================================= */

async function copyUrlToClipboard() {

    const url =
        window.location.href;


    try {

        if (
            navigator.clipboard &&
            window.isSecureContext
        ) {

            await navigator.clipboard.writeText(
                url
            );

        }

        else {

            const textarea =
                document.createElement(
                    "textarea"
                );


            textarea.value =
                url;


            textarea.style.position =
                "fixed";

            textarea.style.left =
                "-9999px";


            document.body.appendChild(
                textarea
            );


            textarea.select();


            document.execCommand(
                "copy"
            );


            textarea.remove();

        }


        const oldText =
            copyURLButton.textContent;


        copyURLButton.textContent =
            "已复制";


        setTimeout(
            function() {

                copyURLButton.textContent =
                    oldText;

            },
            1500
        );

    }

    catch (error) {

        console.error(
            "复制失败：",
            error
        );


        alert(
            "复制失败，请手动复制地址栏中的 URL：\n\n" +
            url
        );

    }

}


/* =========================================================
   按钮事件
========================================================= */

refresh.addEventListener(
    "click",
    detectNetwork
);


copyURLButton.addEventListener(
    "click",
    copyUrlToClipboard
);


/* =========================================================
   自动检测
========================================================= */

detectNetwork();


</script>

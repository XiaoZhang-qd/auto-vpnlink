<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>网络国家 / 地区检测</title>


<!-- =========================================================
     动态网站图标
========================================================= -->

<link
    rel="icon"
    id="country-favicon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e5e7eb'/%3E%3C/svg%3E"
>


<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #eef2f7,
            #f8fafc
        );

    color: #111827;
}


/* =========================================================
   卡片
========================================================= */

.card {

    width: 430px;

    max-width: 100%;

    padding: 34px 28px 25px;

    background: #ffffff;

    border-radius: 24px;

    box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.10);

    text-align: center;
}


/* =========================================================
   标题
========================================================= */

.title {

    margin: 0;

    font-size: 27px;

    font-weight: 750;

    line-height: 1.35;
}


.subtitle {

    margin-top: 8px;

    color: #6b7280;

    font-size: 14px;
}


/* =========================================================
   国旗区域
========================================================= */

.flag-area {

    height: 155px;

    margin-top: 20px;

    display: flex;

    align-items: center;

    justify-content: center;
}


#flag {

    display: none;

    width: 150px;

    height: 100px;

    object-fit: contain;

    border-radius: 10px;

    box-shadow:
        0 8px 24px
        rgba(0, 0, 0, 0.14);
}


/* =========================================================
   加载动画
========================================================= */

.spinner {

    width: 44px;

    height: 44px;

    border: 4px solid #e5e7eb;

    border-top-color: #111827;

    border-radius: 50%;

    animation:
        spin 0.8s linear infinite;
}


@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


/* =========================================================
   国家
========================================================= */

#country {

    min-height: 43px;

    margin-top: 4px;

    font-size: 30px;

    font-weight: 750;
}


/* =========================================================
   ISO
========================================================= */

#iso {

    display: none;

    margin-top: 12px;

    padding: 6px 15px;

    border-radius: 999px;

    background: #f3f4f6;

    color: #374151;

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

    font-size: 16px;

    font-weight: 700;

    letter-spacing: 1px;
}


/* =========================================================
   公网 IP
========================================================= */

#ip {

    margin-top: 12px;

    padding: 8px 14px;

    border-radius: 10px;

    background: #f8fafc;

    color: #374151;

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

    font-size: 15px;

    font-weight: 700;

    word-break: break-all;
}


/* =========================================================
   IP 详细信息
========================================================= */

#ip-details {

    display: none;

    margin-top: 12px;

    border:
        1px solid #eeeeee;

    border-radius: 12px;

    overflow: hidden;

    background: #fafafa;

    text-align: left;
}


/* =========================================================
   详情顶部圆形国旗
========================================================= */

.detail-flag-header {

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 12px;

    background: #ffffff;

    border-bottom:
        1px solid #eeeeee;
}


#detail-country-flag {

    width: 42px;

    height: 42px;

    display: none;

    object-fit: contain;
}


/* =========================================================
   IP 信息行
========================================================= */

.ip-detail-row {

    display: flex;

    align-items: center;

    gap: 12px;

    min-height: 34px;

    padding:
        7px 12px;

    border-bottom:
        1px solid #eeeeee;
}


.ip-detail-row:last-child {

    border-bottom:
        none;
}


.ip-detail-label {

    flex:
        0 0 72px;

    color: #6b7280;

    font-size: 12px;

    white-space: nowrap;
}


.ip-detail-value {

    flex: 1;

    min-width: 0;

    color: #374151;

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

    font-size: 12px;

    font-weight: 600;

    word-break: break-all;

    text-align: right;
}


/* =========================================================
   状态
========================================================= */

#status {

    min-height: 48px;

    margin-top: 20px;

    color: #6b7280;

    font-size: 14px;

    line-height: 1.7;
}


.success {

    color: #16a34a !important;
}


.error {

    color: #dc2626 !important;
}


/* =========================================================
   按钮
========================================================= */

button {

    width: 100%;

    margin-top: 12px;

    padding: 12px 20px;

    border: none;

    border-radius: 11px;

    background: #111827;

    color: #ffffff;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

    transition:
        opacity 0.15s,
        transform 0.1s;
}


button:hover {

    opacity: 0.88;
}


button:active {

    transform: scale(0.98);
}


button:disabled {

    opacity: 0.5;

    cursor: not-allowed;
}


/* =========================================================
   底部
========================================================= */

.footer {

    margin-top: 20px;

    padding-top: 15px;

    border-top:
        1px solid #eeeeee;

    color: #9ca3af;

    font-size: 12px;

    line-height: 1.6;
}


/* =========================================================
   手机
========================================================= */

@media (max-width: 480px) {

    body {
        padding: 15px;
    }

    .card {
        padding: 28px 22px 24px;
    }

    .title {
        font-size: 24px;
    }

    #country {
        font-size: 27px;
    }

}

</style>

</head>

<script>


/* =========================================================
   IP-API
========================================================= */

const IP_API =
    "https://ip-api.com/json/";


/* =========================================================
   IP-API 字段
========================================================= */

const FIELDS =
    "status,message,country,countryCode,region,regionName,city,zip,lat,lon,timezone,isp,org,as,query";


/* =========================================================
   国旗 API
========================================================= */


/*
 * 1. FlagsAPI
 */

const FLAG_API_1 =
    "https://flagsapi.com/{ISO}/flat/64.png";


/*
 * 2. CountriesData
 */

const FLAG_API_2 =
    "https://raw.githubusercontent.com/Vihan/CountriesData/refs/heads/ver-0.1/countries_flags/{ISO}.png";


/*
 * 3. FlagCDN
 */

const FLAG_API_3 =
    "https://flagcdn.com/{ISO}.svg";


/*
 * 4. REST Countries
 *
 * 当前仍提供：
 *
 * /v5/svg/{iso}.svg
 */

const FLAG_API_4 =
    "https://flags.restcountries.com/v5/svg/{ISO}.svg";


/*
 * 5. Circle Flags
 *
 * 这个专门用于：
 *
 * - favicon
 * - IP 详情区域圆形国旗
 */

const CIRCLE_FLAG_API =
    "https://hatscripts.github.io/circle-flags/flags/{ISO}.svg";


/* =========================================================
   JSONP 超时时间
========================================================= */

const JSONP_TIMEOUT =
    12000;


/* =========================================================
   DOM
========================================================= */

const loading =
    document.getElementById(
        "loading"
    );


const flag =
    document.getElementById(
        "flag"
    );


const country =
    document.getElementById(
        "country"
    );


const iso =
    document.getElementById(
        "iso"
    );


const ip =
    document.getElementById(
        "ip"
    );


const status =
    document.getElementById(
        "status"
    );


const refresh =
    document.getElementById(
        "refresh"
    );


/* =========================================================
   favicon
========================================================= */

const favicon =
    document.getElementById(
        "country-favicon"
    );


/* =========================================================
   IP 详情
========================================================= */

const ipDetails =
    document.getElementById(
        "ip-details"
    );


const detailCountryFlag =
    document.getElementById(
        "detail-country-flag"
    );


const detailFields = {

    country:
        document.getElementById(
            "detail-country"
        ),

    countryCode:
        document.getElementById(
            "detail-countryCode"
        ),

    region:
        document.getElementById(
            "detail-region"
        ),

    regionName:
        document.getElementById(
            "detail-regionName"
        ),

    city:
        document.getElementById(
            "detail-city"
        ),

    zip:
        document.getElementById(
            "detail-zip"
        ),

    lat:
        document.getElementById(
            "detail-lat"
        ),

    lon:
        document.getElementById(
            "detail-lon"
        ),

    timezone:
        document.getElementById(
            "detail-timezone"
        ),

    isp:
        document.getElementById(
            "detail-isp"
        ),

    org:
        document.getElementById(
            "detail-org"
        ),

    as:
        document.getElementById(
            "detail-as"
        )

};


/* =========================================================
   清理字符串
========================================================= */

function clean(value) {

    return String(
        value == null ? "" : value
    )
    .replace(
        /[\r\n\t]/g,
        ""
    )
    .trim();

}


/* =========================================================
   ISO 验证
========================================================= */

function validISO(value) {

    return /^[A-Z]{2}$/.test(
        value
    );

}


/* =========================================================
   创建 URL
========================================================= */

function buildFlagURL(
    template,
    countryISO,
    lowercase = false
) {

    const code =
        lowercase
            ? countryISO.toLowerCase()
            : countryISO.toUpperCase();

    return template.replace(
        "{ISO}",
        code
    );

}


/* =========================================================
   设置 favicon
========================================================= */

function updateFavicon(
    countryISO
) {

    if (!favicon) {
        return;
    }


    const circleFlagURL =
        buildFlagURL(
            CIRCLE_FLAG_API,
            countryISO,
            true
        );


    /*
     * 直接设置 favicon
     */

    favicon.href =
        circleFlagURL;


    console.log(
        "网站 favicon：",
        circleFlagURL
    );

}


/* =========================================================
   更新详情区域圆形国旗
========================================================= */

function updateDetailCircleFlag(
    countryISO
) {

    if (!detailCountryFlag) {
        return;
    }


    const circleFlagURL =
        buildFlagURL(
            CIRCLE_FLAG_API,
            countryISO,
            true
        );


    /*
     * 先隐藏
     */

    detailCountryFlag.style.display =
        "none";


    /*
     * 防止旧图片触发
     */

    detailCountryFlag.onload =
        function() {

            detailCountryFlag.style.display =
                "block";

        };


    detailCountryFlag.onerror =
        function() {

            console.warn(
                "圆形国旗加载失败：",
                circleFlagURL
            );

            detailCountryFlag.style.display =
                "none";

        };


    detailCountryFlag.src =
        circleFlagURL;

}


/* =========================================================
   详情值
========================================================= */

function detailValue(
    value
) {

    const result =
        clean(value);

    return result
        ? result
        : "—";

}


/* =========================================================
   显示 IP 详细信息
========================================================= */

function displayIPDetails(
    data,
    countryISO
) {

    detailFields.country.textContent =
        detailValue(
            data.country
        );


    detailFields.countryCode.textContent =
        detailValue(
            data.countryCode
        )
        .toUpperCase();


    detailFields.region.textContent =
        detailValue(
            data.region
        );


    detailFields.regionName.textContent =
        detailValue(
            data.regionName
        );


    detailFields.city.textContent =
        detailValue(
            data.city
        );


    detailFields.zip.textContent =
        detailValue(
            data.zip
        );


    detailFields.lat.textContent =
        data.lat == null
            ? "—"
            : String(
                data.lat
            );


    detailFields.lon.textContent =
        data.lon == null
            ? "—"
            : String(
                data.lon
            );


    detailFields.timezone.textContent =
        detailValue(
            data.timezone
        );


    detailFields.isp.textContent =
        detailValue(
            data.isp
        );


    detailFields.org.textContent =
        detailValue(
            data.org
        );


    detailFields.as.textContent =
        detailValue(
            data.as
        );


    /*
     * 更新圆形国旗
     */

    updateDetailCircleFlag(
        countryISO
    );


    /*
     * 显示
     */

    ipDetails.style.display =
        "block";

}


/* =========================================================
   多源国旗加载
========================================================= */

function loadFlagWithFallback(
    countryISO
) {

    return new Promise(
        function(resolve) {


            /*
             * 国旗来源
             */

            const flagSources = [

                buildFlagURL(
                    FLAG_API_1,
                    countryISO
                ),

                buildFlagURL(
                    FLAG_API_2,
                    countryISO
                ),

                buildFlagURL(
                    FLAG_API_3,
                    countryISO
                ),

                buildFlagURL(
                    FLAG_API_4,
                    countryISO
                )

            ];


            let index = 0;


            /*
             * 尝试下一个
             */

            function tryNext() {


                /*
                 * 全部失败
                 */

                if (
                    index >=
                    flagSources.length
                ) {

                    resolve(
                        null
                    );

                    return;

                }


                const currentURL =
                    flagSources[index];


                index++;


                console.log(
                    "正在尝试国旗 API：",
                    currentURL
                );


                /*
                 * 测试图片
                 */

                const testImage =
                    new Image();


                let finished =
                    false;


                /*
                 * 成功
                 */

                testImage.onload =
                    function() {

                        if (finished) {
                            return;
                        }


                        finished =
                            true;


                        console.log(
                            "国旗 API 加载成功：",
                            currentURL
                        );


                        resolve(
                            currentURL
                        );

                    };


                /*
                 * 失败
                 */

                testImage.onerror =
                    function() {

                        if (finished) {
                            return;
                        }


                        finished =
                            true;


                        console.warn(
                            "国旗 API 加载失败：",
                            currentURL
                        );


                        tryNext();

                    };


                /*
                 * 防缓存
                 */

                testImage.src =
                    currentURL +
                    (
                        currentURL.includes("?")
                            ? "&"
                            : "?"
                    ) +
                    "t=" +
                    Date.now();

            }


            tryNext();

        }
    );

}


/* =========================================================
   显示国旗
========================================================= */

function displayFlag(
    imageURL
) {

    return new Promise(
        function(resolve) {


            if (!imageURL) {

                resolve(
                    false
                );

                return;

            }


            /*
             * 清除旧事件
             */

            flag.onload =
                null;

            flag.onerror =
                null;


            flag.style.display =
                "none";


            /*
             * 成功
             */

            flag.onload =
                function() {

                    flag.style.display =
                        "block";


                    resolve(
                        true
                    );

                };


            /*
             * 失败
             */

            flag.onerror =
                function() {

                    flag.style.display =
                        "none";


                    resolve(
                        false
                    );

                };


            /*
             * 设置图片
             */

            flag.src =
                imageURL;

        }
    );

}


/* =========================================================
   JSONP
========================================================= */

function requestJSONP() {

    return new Promise(
        function(
            resolve,
            reject
        ) {


            /*
             * 唯一 callback
             */

            const callbackName =
                "__ipApiCallback_" +
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .substring(2);


            /*
             * Script
             */

            const script =
                document.createElement(
                    "script"
                );


            let finished =
                false;


            /*
             * 清理
             */

            function cleanup() {

                clearTimeout(
                    timer
                );


                try {

                    delete window[
                        callbackName
                    ];

                }

                catch (_) {

                    window[
                        callbackName
                    ] = undefined;

                }


                if (
                    script.parentNode
                ) {

                    script.parentNode
                        .removeChild(
                            script
                        );

                }

            }


            /*
             * 超时
             */

            const timer =
                setTimeout(
                    function() {

                        if (finished) {
                            return;
                        }


                        finished =
                            true;


                        cleanup();


                        reject(
                            new Error(
                                "IP-API 请求超时"
                            )
                        );

                    },
                    JSONP_TIMEOUT
                );


            /*
             * JSONP callback
             */

            window[
                callbackName
            ] =
                function(data) {

                    if (finished) {
                        return;
                    }


                    finished =
                        true;


                    cleanup();


                    resolve(
                        data
                    );

                };


            /*
             * Script error
             */

            script.onerror =
                function() {

                    if (finished) {
                        return;
                    }


                    finished =
                        true;


                    cleanup();


                    reject(
                        new Error(
                            "IP-API LOAD FAILED"
                        )
                    );

                };


            /*
             * URL
             */

            const url =
                IP_API +
                "?fields=" +
                encodeURIComponent(
                    FIELDS
                ) +
                "&lang=zh-CN" +
                "&callback=" +
                encodeURIComponent(
                    callbackName
                ) +
                "&t=" +
                Date.now();


            script.src =
                url;


            script.async =
                true;


            document.head.appendChild(
                script
            );

        }
    );

}


/* =========================================================
   主检测
========================================================= */

async function detectNetwork() {


    /*
     * 防止重复点击
     */

    refresh.disabled =
        true;


    /*
     * 重置界面
     */

    loading.style.display =
        "block";


    flag.style.display =
        "none";


    iso.style.display =
        "none";


    ipDetails.style.display =
        "none";


    detailCountryFlag.style.display =
        "none";


    ip.textContent =
        "IP：检测中...";


    country.textContent =
        "检测中...";


    status.textContent =
        "正在连接 IP 定位服务...";


    status.className =
        "";


    /*
     * 重置 favicon
     */

    favicon.href =
        "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e5e7eb'/%3E%3C/svg%3E";


    /*
     * =====================================================
     * IP-API 重试
     * =====================================================
     */

    let data =
        null;


    let lastError =
        null;


    for (
        let attempt = 1;
        attempt <= 2;
        attempt++
    ) {

        try {

            if (attempt === 2) {

                status.textContent =
                    "正在重试 IP 定位服务...";

            }


            data =
                await requestJSONP();


            break;

        }

        catch (error) {

            lastError =
                error;


            console.warn(
                "IP-API 第 " +
                attempt +
                " 次失败：",
                error
            );

        }

    }


    /*
     * =====================================================
     * IP API 完全失败
     * =====================================================
     */

    if (!data) {

        loading.style.display =
            "none";


        country.textContent =
            "检测失败";


        ip.textContent =
            "IP：无法获取";


        status.innerHTML =
            "IP 定位服务无法连接。<br>" +
            "错误：" +
            clean(
                lastError
                    ? lastError.message
                    : "Unknown error"
            );


        status.className =
            "error";


        refresh.disabled =
            false;


        return;

    }


    /*
     * =====================================================
     * API 返回错误
     * =====================================================
     */

    if (
        data.status !==
        "success"
    ) {

        loading.style.display =
            "none";


        country.textContent =
            "检测失败";


        ip.textContent =
            "IP：无法获取";


        status.innerHTML =
            "IP 定位服务返回错误。<br>" +
            clean(
                data.message ||
                "Unknown error"
            );


        status.className =
            "error";


        refresh.disabled =
            false;


        return;

    }


    /*
     * =====================================================
     * 国家
     * =====================================================
     */

    const countryName =
        clean(
            data.country
        );


    const countryISO =
        clean(
            data.countryCode
        )
        .toUpperCase();


    /*
     * 国家名称检查
     */

    if (!countryName) {

        loading.style.display =
            "none";


        country.textContent =
            "检测失败";


        status.textContent =
            "IP API 没有返回国家名称。";


        status.className =
            "error";


        refresh.disabled =
            false;


        return;

    }


    /*
     * ISO 检查
     */

    if (
        !validISO(
            countryISO
        )
    ) {

        loading.style.display =
            "none";


        country.textContent =
            countryName;


        status.textContent =
            "国家代码无效：" +
            countryISO;


        status.className =
            "error";


        refresh.disabled =
            false;


        return;

    }


    /*
     * =====================================================
     * 公网 IP
     * =====================================================
     */

    const publicIP =
        clean(
            data.query
        );


    ip.textContent =
        publicIP
            ? "IP：" + publicIP
            : "IP：API 未返回 IP";


    /*
     * =====================================================
     * 国家
     * =====================================================
     */

    country.textContent =
        countryName;


    /*
     * =====================================================
     * ISO
     * =====================================================
     */

    iso.textContent =
        countryISO;


    iso.style.display =
        "inline-block";


    /*
     * =====================================================
     * 显示详细信息
     * =====================================================
     */

    displayIPDetails(
        data,
        countryISO
    );


    /*
     * =====================================================
     * 设置 favicon
     * =====================================================
     */

    updateFavicon(
        countryISO
    );


    /*
     * =====================================================
     * 加载多源国旗
     * =====================================================
     */

    status.textContent =
        "正在加载国旗...";


    const successURL =
        await loadFlagWithFallback(
            countryISO
        );


    /*
     * =====================================================
     * 国旗成功
     * =====================================================
     */

    if (successURL) {

        const displayed =
            await displayFlag(
                successURL
            );


        loading.style.display =
            "none";


        if (displayed) {

            status.textContent =
                "检测完成";


            status.className =
                "success";

        }

        else {

            status.innerHTML =
                "国家检测成功：" +
                countryName +
                "（" +
                countryISO +
                "）<br>" +
                "国旗图片加载失败。";


            status.className =
                "error";

        }


        refresh.disabled =
            false;


        return;

    }


    /*
     * =====================================================
     * 所有国旗 API 都失败
     * =====================================================
     */

    loading.style.display =
        "none";


    flag.style.display =
        "none";


    status.innerHTML =
        "国家检测成功：" +
        countryName +
        "（" +
        countryISO +
        "）<br>" +
        "但所有国旗 API 均无法加载。";


    status.className =
        "error";


    refresh.disabled =
        false;

}


/* =========================================================
   自动检测
========================================================= */

detectNetwork();

</script>

# Add any public Git repository here. The scanner only reads text/config files;
# it does not execute repository code.
extra_repositories: []

scan:
  max_repositories_per_topic: 20
  max_files_per_repository: 30
  max_file_size: 800000
  request_timeout: 8
  workers: 8
  max_subscription_checks: 600
  max_aggregate_nodes: 20000
